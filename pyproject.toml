[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runmedic"
dynamic = ["version"]
description = "Diagnose ML training runs from their logs: NaNs, divergence, overfitting, idle GPUs, memory leaks. Built for humans and coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "vincere-mori" }]
keywords = ["machine-learning", "deep-learning", "pytorch", "tensorboard", "mlflow", "wandb", "debugging", "training", "agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
wandb = ["wandb>=0.17"]

[project.urls]
Homepage = "https://github.com/vincere-mori/runmedic"
Issues = "https://github.com/vincere-mori/runmedic/issues"

[project.scripts]
runmedic = "runmedic.cli:main"

[tool.hatch.version]
path = "src/runmedic/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/runmedic"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
