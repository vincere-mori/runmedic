<svg xmlns="http://www.w3.org/2000/svg" width="1073" height="328" viewBox="0 0 1073 328">
<rect width="100%" height="100%" rx="10" fill="#0d1117"/>
<circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="42" cy="20" r="6" fill="#febc2e"/><circle cx="62" cy="20" r="6" fill="#28c840"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14">
<text x="20" y="62" fill="#c9d1d9" font-weight="600" xml:space="preserve">$ runmedic diagnose examples/logs/overfit</text>
<text x="20" y="82" fill="#8b949e" xml:space="preserve"></text>
<text x="20" y="102" fill="#c9d1d9" font-weight="600" xml:space="preserve">Found: 1 warning</text>
<text x="20" y="122" fill="#8b949e" xml:space="preserve"></text>
<text x="20" y="142" fill="#d29922" font-weight="600" xml:space="preserve">1. [WARNING] Overfitting since step 15</text>
<text x="20" y="162" fill="#c9d1d9" xml:space="preserve">   · `val/loss` was best at step 15 (0.6449) and is now 2.167 (last 3 evaluations average +236%) after 147 more evaluations</text>
<text x="20" y="182" fill="#c9d1d9" xml:space="preserve">   · meanwhile `train/loss` kept falling: 0.6633 → 4.54e-04</text>
<text x="20" y="202" fill="#7ee787" font-weight="600" xml:space="preserve">   Likely causes:</text>
<text x="20" y="222" fill="#8b949e" xml:space="preserve">     - The model memorizes the training set: too many epochs for the data size, or not enough regularization</text>
<text x="20" y="242" fill="#7ee787" font-weight="600" xml:space="preserve">   What to try:</text>
<text x="20" y="262" fill="#8b949e" xml:space="preserve">     1. Keep the checkpoint from step 15 and add early stopping on `val/loss`</text>
<text x="20" y="282" fill="#8b949e" xml:space="preserve">     2. Add regularization: weight decay, dropout, stronger augmentation, label smoothing</text>
<text x="20" y="302" fill="#8b949e" xml:space="preserve">     3. Get more data or use a smaller model / fewer trainable parameters (e.g. LoRA instead of full fine-tune)</text>
</g>
</svg>
